<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiemaen AI - Ultimate Intelligence Core</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #131b2e;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Clean Dropdown / Drawer Panel */
        .select-wrapper {
            position: relative;
        }

        select {
            background: var(--bg-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 0.4rem;
            outline: none;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 1rem;
            overflow: hidden;
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding-right: 0.25rem;
            margin-bottom: 1rem;
        }

        .message {
            padding: 1rem;
            border-radius: 0.75rem;
            line-height: 1.5;
            max-width: 90%;
            word-wrap: break-word;
            font-size: 0.95rem;
        }

        .message.user {
            background: #1e293b;
            color: var(--text-primary);
            align-self: flex-end;
            border: 1px solid #334155;
            white-space: pre-wrap;
        }

        .message.ai {
            background: var(--panel-bg);
            color: var(--text-primary);
            align-self: flex-start;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            width: 100%;
        }

        .message.ai table {
            width: 100%;
            border-collapse: collapse;
            margin: 0.75rem 0;
            font-size: 0.85rem;
        }

        .message.ai th, .message.ai td {
            border: 1px solid var(--border-color);
            padding: 0.5rem;
            text-align: left;
        }

        .message.ai th {
            background-color: #1e293b;
            color: var(--accent-color);
        }

        .message.ai pre {
            background: #090d16;
            padding: 0.75rem;
            border-radius: 0.4rem;
            overflow-x: auto;
            margin: 0.5rem 0;
            border: 1px solid var(--border-color);
        }

        .ai-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.4rem;
            font-size: 0.8rem;
            color: var(--accent-color);
            font-weight: 600;
        }

        .speak-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.2rem 0.4rem;
            border-radius: 0.2rem;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .speak-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        input[type="file"] {
            display: none;
        }

        .input-form {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 0.5rem 0.75rem;
            border-radius: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        textarea {
            background: transparent;
            border: none;
            color: var(--text-primary);
            resize: none;
            outline: none;
            font-size: 0.95rem;
            min-height: 40px;
            max-height: 120px;
        }

        .input-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 0.4rem;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        /* Symbol Icon Buttons */
        .icon-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        .icon-btn.listening {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
            animation: pulse 1.5s infinite;
        }

        button.execute-btn {
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: box-shadow 0.2s;
        }

        button.execute-btn:hover {
            box-shadow: 0 0 12px var(--accent-glow);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        #file-indicator {
            font-size: 0.75rem;
            color: var(--accent-color);
            display: none;
            align-items: center;
            gap: 0.3rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="status-dot"></div>
            <h1>Kiemaen AI</h1>
        </div>
        <div class="select-wrapper">
            <select id="persona-select" title="Auto-detecting Persona Panel">
                <option value="general">General Core</option>
                <option value="engineering">Civil Engineering</option>
                <option value="trading">Institutional Trading</option>
                <option value="coding">Software Engineering</option>
            </select>
        </div>
    </header>

    <div class="main-container">
        <div id="chat-window">
            <div class="message ai">
                <div class="ai-header">
                    <span>KIEMAEN SYSTEM ONLINE</span>
                </div>
                Autonomous nodes active. Drop files or use voice symbols below to execute.
            </div>
        </div>

        <form id="chat-form" class="input-form">
            <textarea id="prompt-input" placeholder="Message Kiemaen AI..." rows="1" required></textarea>
            <div class="input-actions">
                <div class="action-buttons">
                    <!-- Symbol Attachment Button -->
                    <label class="icon-btn" for="file-input" title="Attach Document">📎</label>
                    <input type="file" id="file-input">
                    <span id="file-indicator">📄 <span id="file-name-text"></span></span>
                </div>
                <div class="action-buttons">
                    <!-- Symbol Voice Recording Button -->
                    <button type="button" id="mic-btn" class="icon-btn" title="Voice Input">🎙️</button>
                    <!-- Symbol Execute Button -->
                    <button type="submit" class="execute-btn" title="Execute">➔</button>
                </div>
            </div>
        </form>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const chatForm = document.getElementById('chat-form');
        const promptInput = document.getElementById('prompt-input');
        const personaSelect = document.getElementById('persona-select');
        const fileInput = document.getElementById('file-input');
        const fileIndicator = document.getElementById('file-indicator');
        const fileNameText = document.getElementById('file-name-text');
        const micBtn = document.getElementById('mic-btn');

        let selectedFile = null;

        // Auto-detect file selection
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileNameText.textContent = selectedFile.name;
                fileIndicator.style.display = 'inline-flex';
            }
        });

        // Auto-detect prompt content to auto-switch personas (optional intelligence upgrade)
        promptInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            if (val.includes('beam') || val.includes('stress') || val.includes('load') || val.includes('concrete')) {
                personaSelect.value = 'engineering';
            } else if (val.includes('price') || val.includes('trade') || val.includes('gold') || val.includes('bitcoin')) {
                personaSelect.value = 'trading';
            } else if (val.includes('def ') || val.includes('function') || val.includes('code') || val.includes('python')) {
                personaSelect.value = 'coding';
            }
        });

        // Speech-to-Text Voice Recording Symbol
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            micBtn.addEventListener('click', () => {
                if (micBtn.classList.contains('listening')) {
                    recognition.stop();
                    return;
                }
                recognition.start();
            });

            recognition.onstart = () => {
                micBtn.classList.add('listening');
            };

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                promptInput.value += (promptInput.value ? ' ' : '') + speechToText;
            };

            recognition.onerror = () => {
                micBtn.classList.remove('listening');
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
            };
        } else {
            micBtn.style.display = 'none';
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/```[\s\S]*?```/g, "Code omitted.").replace(/[*#_`-]/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                window.speechSynthesis.speak(utterance);
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const promptText = promptInput.value.trim();
            if (!promptText && !selectedFile) return;

            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user';
            userMsgDiv.textContent = promptText + (selectedFile ? ` [📎 ${selectedFile.name}]` : '');
            chatWindow.appendChild(userMsgDiv);
            
            const currentPrompt = promptText;
            const currentPersona = personaSelect.value;
            const currentFile = selectedFile;

            promptInput.value = '';
            fileInput.value = '';
            selectedFile = null;
            fileIndicator.style.display = 'none';
            chatWindow.scrollTop = chatWindow.scrollHeight;

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai';
            aiMsgDiv.innerHTML = `<div class="ai-header"><span>PROCESSING...</span></div>Analyzing telemetry...`;
            chatWindow.appendChild(aiMsgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            const formData = new FormData();
            formData.append('prompt', currentPrompt);
            formData.append('persona', currentPersona);
            if (currentFile) {
                formData.append('file', currentFile);
            }

            try {
                const response = await fetch('/generate', { method: 'POST', body: formData });
                const data = await response.json();
                const responseText = data.response || "No response.";
                
                aiMsgDiv.innerHTML = `
                    <div class="ai-header">
                        <span>KIEMAEN AI (${currentPersona.toUpperCase()})</span>
                        <button class="speak-btn" onclick="speakText(this.dataset.text)" data-text="${encodeURIComponent(responseText)}">🔊</button>
                    </div>
                    ${marked.parse(responseText)}
                `;
            } catch (err) {
                aiMsgDiv.innerHTML = `<div class="ai-header"><span>ERROR</span></div>Fault: ${err.message}`;
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;
        });
    </script>
</body>
</html>

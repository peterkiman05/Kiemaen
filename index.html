<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiemaen AI - Ultimate Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        /* Custom scrollbar for clean UI */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col md:flex-row">

    <!-- History Sidebar -->
    <aside class="w-64 bg-gray-800 border-r border-gray-700 hidden md:flex flex-col h-full">
        <div class="p-4 border-b border-gray-700 font-bold text-blue-400 flex justify-between items-center">
            <span>Chat History</span>
            <div class="flex gap-1">
                <button onclick="loadHistory()" class="text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-gray-300" title="Refresh">🔄</button>
                <button onclick="clearHistory()" class="text-xs bg-red-900/60 hover:bg-red-800 px-2 py-1 rounded text-red-200" title="Clear History">🗑️</button>
            </div>
        </div>
        <div id="history-list" class="flex-1 overflow-y-auto p-2 space-y-2 text-xs text-gray-300">
            <div class="p-2 text-gray-500 italic">Loading history...</div>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <div class="flex-1 flex flex-col h-full relative">
        
        <!-- Header & Persona Selector -->
        <header class="bg-gray-800 p-3 md:p-4 border-b border-gray-700 flex justify-between items-center shadow-md z-10">
            <h1 class="text-lg md:text-xl font-bold text-blue-400">Kiemaen AI</h1>
            <select id="persona" class="bg-gray-700 text-xs md:text-sm p-2 rounded border border-gray-600 focus:outline-none text-white">
                <option value="general">General AI</option>
                <option value="engineering">Civil Engineering</option>
                <option value="trading">Financial Trading</option>
                <option value="coding">Software Coding</option>
            </select>
        </header>

        <!-- Chat Messages Box -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto pb-36 md:pb-28">
            <div class="flex justify-start">
                <div class="bg-gray-800 p-3 rounded-lg max-w-[85%] md:max-w-xl text-sm border border-gray-700">
                    Kiemaen AI online. Select your persona, type a prompt, or attach a file/PDF below!
                </div>
            </div>
        </div>

        <!-- Fixed Bottom Input Form -->
        <div class="fixed bottom-0 left-0 right-0 bg-gray-800/95 backdrop-blur border-t border-gray-700 p-3 md:p-4 z-20 pb-6 md:pb-4 shadow-lg">
            <form id="chat-form" class="max-w-3xl mx-auto flex flex-col gap-2">
                <div class="flex gap-2">
                    <input type="text" id="prompt-input" placeholder="Message Kiemaen AI..." autocomplete="off"
                        class="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-3 md:px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 text-white">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-4 md:px-5 py-2.5 rounded-lg text-sm font-semibold transition">
                        Send
                    </button>
                </div>
                <div class="flex items-center justify-between text-xs text-gray-400 px-1">
                    <label class="cursor-pointer flex items-center gap-1 hover:text-blue-400 py-1">
                        <span>📎 Attach File / PDF</span>
                        <input type="file" id="file-input" class="hidden" accept=".py,.txt,.md,.json,.csv,.js,.ts,.pdf">
                    </label>
                    <span id="file-name" class="italic text-gray-500 truncate max-w-[200px]">No file attached</span>
                </div>
            </form>
        </div>

    </div>

    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('prompt-input');
        const container = document.getElementById('chat-container');
        const personaSelect = document.getElementById('persona');
        const historyList = document.getElementById('history-list');
        const fileInput = document.getElementById('file-input');
        const fileNameDisplay = document.getElementById('file-name');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileNameDisplay.textContent = file.name;
            } else {
                fileNameDisplay.textContent = "No file attached";
            }
        });

        async function loadHistory() {
            if (!historyList) return;
            try {
                const res = await fetch('/history');
                const data = await res.json();
                if (data.history && data.history.length > 0) {
                    historyList.innerHTML = '';
                    data.history.forEach(item => {
                        const div = document.createElement('div');
                        div.className = "p-2 bg-gray-700/50 rounded border border-gray-700 hover:bg-gray-700 cursor-pointer";
                        div.innerHTML = `
                            <div class="font-semibold text-blue-300 uppercase text-[10px]">${item.persona}</div>
                            <div class="truncate text-gray-200">${escapeHtml(item.user_prompt)}</div>`;
                        historyList.appendChild(div);
                    });
                } else {
                    historyList.innerHTML = '<div class="p-2 text-gray-500 italic">No history found.</div>';
                }
            } catch (err) {
                historyList.innerHTML = '<div class="p-2 text-red-400 italic">Failed to load history.</div>';
            }
        }

        async function clearHistory() {
            if (!confirm("Clear all chat history?")) return;
            try {
                const res = await fetch('/history/clear', { method: 'DELETE' });
                if (res.ok) {
                    loadHistory();
                    container.innerHTML = `
                        <div class="flex justify-start">
                            <div class="bg-gray-800 p-3 rounded-lg max-w-xl text-sm border border-gray-700">
                                History cleared. Kiemaen AI ready.
                            </div>
                        </div>`;
                }
            } catch (err) {
                alert("Connection error.");
            }
        }

        loadHistory();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            let text = input.value.trim();
            const persona = personaSelect.value;
            const file = fileInput.files[0];
            
            if (!text && !file) return;

            // Append User Message
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = "flex justify-end";
            userMsgDiv.innerHTML = `
                <div class="bg-blue-600 text-white p-3 rounded-lg max-w-[85%] md:max-w-xl text-sm whitespace-pre-wrap">
                    ${escapeHtml(text)} ${file ? `📎 (${file.name})` : ''}
                </div>`;
            container.appendChild(userMsgDiv);
            
            input.value = '';
            fileInput.value = '';
            fileNameDisplay.textContent = "No file attached";

            container.scrollTop = container.scrollHeight;

            // Append Loading Indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = "flex justify-start";
            loadingDiv.innerHTML = `
                <div class="bg-gray-800 text-gray-400 p-3 rounded-lg text-sm border border-gray-700 animate-pulse">
                    Thinking...
                </div>`;
            container.appendChild(loadingDiv);
            container.scrollTop = container.scrollHeight;

            try {
                const formData = new FormData();
                formData.append("prompt", text || "Analyze attached file");
                formData.append("persona", persona);
                if (file) {
                    formData.append("file", file);
                }

                const response = await fetch('/generate', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (container.contains(loadingDiv)) {
                    container.removeChild(loadingDiv);
                }

                const aiReply = data.response || data.detail || "Error generating response.";
                const parsedMarkdown = marked.parse(aiReply);

                const aiMsgDiv = document.createElement('div');
                aiMsgDiv.className = "flex justify-start";
                aiMsgDiv.innerHTML = `
                    <div class="bg-gray-800 p-4 rounded-lg max-w-[90%] md:max-w-2xl text-sm border border-gray-700 space-y-2 leading-relaxed overflow-x-auto">
                        ${parsedMarkdown}
                    </div>`;
                container.appendChild(aiMsgDiv);
                
                loadHistory();
            } catch (err) {
                if (container.contains(loadingDiv)) {
                    container.removeChild(loadingDiv);
                }
                const errorDiv = document.createElement('div');
                errorDiv.className = "flex justify-start";
                errorDiv.innerHTML = `
                    <div class="bg-red-900 text-red-200 p-3 rounded-lg text-sm border border-red-700">
                        Connection error with Kiemaen AI backend.
                    </div>`;
                container.appendChild(errorDiv);
            }
            container.scrollTop = container.scrollHeight;
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>

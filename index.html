<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiemaen AI - Ultimate Intelligence Core</title>
    <!-- Include Marked.js for real Markdown and Table rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #131b2e;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .controls-group {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        select {
            background: var(--bg-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            outline: none;
            cursor: pointer;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 950px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem;
            overflow: hidden;
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding-right: 0.5rem;
            margin-bottom: 1rem;
        }

        .message {
            padding: 1.25rem;
            border-radius: 0.75rem;
            line-height: 1.6;
            max-width: 90%;
            word-wrap: break-word;
        }

        .message.user {
            background: #1e293b;
            color: var(--text-primary);
            align-self: flex-end;
            border: 1px solid #334155;
            white-space: pre-wrap;
        }

        .message.ai {
            background: var(--panel-bg);
            color: var(--text-primary);
            align-self: flex-start;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 100%;
        }

        /* Markdown Styling inside AI messages */
        .message.ai table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            font-size: 0.9rem;
        }

        .message.ai th, .message.ai td {
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            text-align: left;
        }

        .message.ai th {
            background-color: #1e293b;
            color: var(--accent-color);
        }

        .message.ai pre {
            background: #090d16;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 0.75rem 0;
            border: 1px solid var(--border-color);
        }

        .message.ai code {
            font-family: monospace;
            color: #38bdf8;
        }

        .ai-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: 600;
        }

        .speak-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
        }

        .speak-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        input[type="file"] {
            display: none;
        }

        .file-upload-label {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.75rem;
            border-radius: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .file-upload-label:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        .input-form {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            border-radius: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        textarea {
            background: transparent;
            border: none;
            color: var(--text-primary);
            resize: none;
            outline: none;
            font-size: 0.95rem;
            min-height: 50px;
            max-height: 150px;
        }

        .input-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 0.5rem;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        button.action-btn {
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 0.6rem 1.25rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: box-shadow 0.2s;
        }

        button.action-btn:hover {
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .mic-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.6rem;
            border-radius: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .mic-btn.listening {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        #file-name-display {
            font-size: 0.8rem;
            color: var(--accent-color);
            margin-left: 0.5rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="status-dot"></div>
            <h1>Kiemaen AI <span style="color:var(--text-secondary); font-weight:400; font-size:0.9rem;">Core v9.0</span></h1>
        </div>
        <div class="controls-group">
            <select id="persona-select">
                <option value="general">General Intelligent Core</option>
                <option value="engineering">Civil Engineering Consultant</option>
                <option value="trading">Institutional Trading Mentor</option>
                <option value="coding">Principal Software Engineer</option>
            </select>
        </div>
    </header>

    <div class="main-container">
        <div id="chat-window">
            <div class="message ai">
                <div class="ai-header">
                    <span>KIEMAEN SYSTEM ONLINE</span>
                </div>
                Greetings. Autonomous research nodes, secure simulation sandboxes, live market feeds, voice interface, and database state persistence are fully active. How shall we execute today?
            </div>
        </div>

        <form id="chat-form" class="input-form">
            <textarea id="prompt-input" placeholder="Type prompt, calculation query, or use voice..." rows="2" required></textarea>
            <div class="input-actions">
                <div class="action-buttons">
                    <label class="file-upload-label" for="file-input">
                        📎 Attach File
                    </label>
                    <input type="file" id="file-input">
                    <span id="file-name-display"></span>
                </div>
                <div class="action-buttons">
                    <button type="button" id="mic-btn" class="mic-btn" title="Speech to Text">🎙️ Speak</button>
                    <button type="submit" class="action-btn">Execute ➔</button>
                </div>
            </div>
        </form>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const chatForm = document.getElementById('chat-form');
        const promptInput = document.getElementById('prompt-input');
        const personaSelect = document.getElementById('persona-select');
        const fileInput = document.getElementById('file-input');
        const fileNameDisplay = document.getElementById('file-name-display');
        const micBtn = document.getElementById('mic-btn');

        let selectedFile = null;

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileNameDisplay.textContent = selectedFile.name;
            }
        });

        // Speech Recognition (Speech to Text)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            micBtn.addEventListener('click', () => {
                if (micBtn.classList.contains('listening')) {
                    recognition.stop();
                    return;
                }
                recognition.start();
            });

            recognition.onstart = () => {
                micBtn.classList.add('listening');
                micBtn.textContent = '🔴 Listening...';
            };

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                promptInput.value += (promptInput.value ? ' ' : '') + speechToText;
            };

            recognition.onerror = () => {
                micBtn.classList.remove('listening');
                micBtn.textContent = '🎙️ Speak';
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
                micBtn.textContent = '🎙️ Speak';
            };
        } else {
            micBtn.style.display = 'none';
        }

        // Text to Speech Function
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/```[\s\S]*?```/g, "Code block omitted for voice.")
                                      .replace(/[*#_`-]/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            } else {
                alert('Text-to-speech not supported in this browser.');
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const promptText = promptInput.value.trim();
            if (!promptText && !selectedFile) return;

            // Append User Message
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user';
            userMsgDiv.textContent = promptText + (selectedFile ? ` [Attached: ${selectedFile.name}]` : '');
            chatWindow.appendChild(userMsgDiv);
            
            const currentPrompt = promptText;
            const currentPersona = personaSelect.value;
            const currentFile = selectedFile;

            promptInput.value = '';
            fileInput.value = '';
            selectedFile = null;
            fileNameDisplay.textContent = '';
            chatWindow.scrollTop = chatWindow.scrollHeight;

            // Append Loading AI Placeholder
            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai';
            aiMsgDiv.innerHTML = `<div class="ai-header"><span>KIEMAEN AGENT RUNNING...</span></div>Processing swarm telemetry...`;
            chatWindow.appendChild(aiMsgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            const formData = new FormData();
            formData.append('prompt', currentPrompt);
            formData.append('persona', currentPersona);
            if (currentFile) {
                formData.append('file', currentFile);
            }

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                const responseText = data.response || "No response received.";
                const htmlContent = marked.parse(responseText);
                
                aiMsgDiv.innerHTML = `
                    <div class="ai-header">
                        <span>KIEMAEN AI (${currentPersona.toUpperCase()})</span>
                        <button class="speak-btn" onclick="speakText(this.dataset.text)" data-text="${encodeURIComponent(responseText)}">🔊 Listen</button>
                    </div>
                    ${htmlContent}
                `;
            } catch (err) {
                aiMsgDiv.innerHTML = `<div class="ai-header"><span>ERROR</span></div>Network or server processing fault: ${err.message}`;
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;
        });
    </script>
</body>
</html>

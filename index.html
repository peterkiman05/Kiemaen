<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civil Engineering AI Assistant</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
    <!-- KaTeX Core JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
    <!-- KaTeX Auto-Render Extension -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"
        onload="renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\(', right: '\\)', display: false},
                {left: '\\[', right: '\\]', display: true}
            ]
        });"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-4">
    <div class="w-full max-w-3xl bg-slate-800 rounded-lg shadow-xl p-6 flex flex-col h-[90vh]">
        <header class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
            <h1 class="text-xl font-bold">Civil Engineering AI Assistant</h1>
            <span class="text-xs bg-blue-600/30 text-blue-400 px-2 py-1 rounded border border-blue-500/30">KaTeX & PDF Enabled</span>
        </header>
        
        <div id="chat-container" class="flex-1 overflow-y-auto space-y-4 pr-2 mb-4">
            <div class="text-left">
                <div class="inline-block bg-slate-700 text-slate-100 rounded p-3 text-sm max-w-[85%]">
                    Kiemaen Core Online. Ready to assist with structural analysis, beam deflections, or strength of materials formulas like $\sigma = \frac{M y}{I}$.
                </div>
            </div>
        </div>

        <form id="chat-form" class="space-y-3 bg-slate-800/50 p-3 rounded-lg border border-slate-700">
            <div class="flex gap-2">
                <select id="persona" class="flex-1 bg-slate-700 border border-slate-600 rounded p-2 text-sm focus:outline-none focus:border-blue-500">
                    <option value="general">General Civil Engineering</option>
                    <option value="structures">Structural Analysis (Beams & Trusses)</option>
                    <option value="materials">Strength of Materials</option>
                </select>
            </div>
            
            <textarea id="prompt-input" rows="2" placeholder="Ask a question or enter structural formulas (e.g., $\int \frac{M}{EI} dx$)..." class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm focus:outline-none focus:border-blue-500"></textarea>
            
            <div class="flex justify-between items-center pt-1">
                <div class="flex items-center space-x-2">
                    <input type="file" id="file-input" accept=".pdf" class="text-xs text-slate-400 file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
                </div>
                <button type="submit" class="bg-blue-600 hover:bg-blue-500 px-5 py-2 rounded text-sm font-semibold transition-colors shadow-md">Send Prompt</button>
            </div>
        </form>
    </div>

    <script>
        function triggerMathRender() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ]
            });
        }

        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = document.getElementById('prompt-input').value;
            const persona = document.getElementById('persona').value;
            const fileInput = document.getElementById('file-input').files[0];
            const chatContainer = document.getElementById('chat-container');

            if (!prompt.trim()) return;

            // Append User Message
            chatContainer.innerHTML += `<div class="text-right"><div class="inline-block bg-blue-600 text-white rounded p-3 text-sm max-w-[85%] text-left">${prompt}</div></div>`;
            document.getElementById('prompt-input').value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const formData = new FormData();
            formData.append('prompt', prompt);
            formData.append('persona', persona);
            if (fileInput) formData.append('file', fileInput);

            try {
                // FIXED: Target /generate instead of /api/generate to match FastAPI route
                const response = await fetch('/generate', { method: 'POST', body: formData });
                const data = await response.json();
                
                // Append AI Response
                chatContainer.innerHTML += `<div class="text-left"><div class="inline-block bg-slate-700 text-slate-100 rounded p-3 text-sm max-w-[85%]">${data.response}</div></div>`;
                chatContainer.scrollTop = chatContainer.scrollHeight;
                
                // Trigger KaTeX rendering pass on newly injected content
                triggerMathRender();
            } catch (err) {
                console.error("Transmission error:", err);
                chatContainer.innerHTML += `<div class="text-left"><div class="inline-block bg-red-600/30 text-red-300 rounded p-3 text-sm max-w-[85%]">Critical Link Failure: Unable to reach Kiemaen Core.</div></div>`;
            }
        });
    </script>
</body>
</html>

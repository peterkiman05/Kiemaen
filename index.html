<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiemaen AI - Autonomous Core</title>
    <!-- Marked library script for rendering markdown/tables -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #131b2e;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .auto-status {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            padding: 0.3rem 0.7rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 1rem;
            overflow: hidden;
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding-right: 0.25rem;
            margin-bottom: 1rem;
        }

        .message {
            padding: 1rem;
            border-radius: 0.75rem;
            line-height: 1.5;
            max-width: 90%;
            word-wrap: break-word;
            font-size: 0.95rem;
        }

        .message.user {
            background: #1e293b;
            color: var(--text-primary);
            align-self: flex-end;
            border: 1px solid #334155;
            white-space: pre-wrap;
        }

        .message.ai {
            background: var(--panel-bg);
            color: var(--text-primary);
            align-self: flex-start;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            width: 100%;
        }

        .message.ai table {
            width: 100%;
            border-collapse: collapse;
            margin: 0.75rem 0;
            font-size: 0.85rem;
        }

        .message.ai th, .message.ai td {
            border: 1px solid var(--border-color);
            padding: 0.5rem;
            text-align: left;
        }

        .message.ai th {
            background-color: #1e293b;
            color: var(--accent-color);
        }

        .message.ai pre {
            background: #090d16;
            padding: 0.75rem;
            border-radius: 0.4rem;
            overflow-x: auto;
            margin: 0.5rem 0;
            border: 1px solid var(--border-color);
        }

        .ai-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.4rem;
            font-size: 0.8rem;
            color: var(--accent-color);
            font-weight: 600;
        }

        .speak-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.2rem 0.4rem;
            border-radius: 0.2rem;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .speak-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        input[type="file"] {
            display: none;
        }

        /* Single horizontal row input form container */
        .input-form {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 0.5rem 0.75rem;
            border-radius: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        textarea {
            background: transparent;
            border: none;
            color: var(--text-primary);
            resize: none;
            outline: none;
            font-size: 0.95rem;
            flex: 1;
            max-height: 100px;
            padding: 0.3rem;
            line-height: 1.4;
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* SVG Icon Buttons */
        .icon-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .icon-btn:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        .icon-btn.listening {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
            animation: pulse 1.5s infinite;
        }

        button.execute-btn {
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: box-shadow 0.2s;
            flex-shrink: 0;
        }

        button.execute-btn svg {
            width: 18px;
            height: 18px;
            fill: var(--bg-color);
        }

        button.execute-btn:hover {
            box-shadow: 0 0 12px var(--accent-glow);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        #file-indicator {
            font-size: 0.75rem;
            color: var(--accent-color);
            display: none;
            align-items: center;
            gap: 0.3rem;
            margin-left: 0.5rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="status-dot"></div>
            <h1>Kiemaen AI</h1>
        </div>
        <div id="detector-badge" class="auto-status">⚡ Auto: General Core</div>
    </header>

    <div class="main-container">
        <div id="chat-window">
            <div class="message ai">
                <div class="ai-header">
                    <span>KIEMAEN SYSTEM ONLINE</span>
                </div>
                Autonomous nodes active. Drop files or use voice symbols below to execute.
            </div>
        </div>

        <form id="chat-form" class="input-form">
            <!-- Left side: File attachment icon -->
            <label class="icon-btn" for="file-input" title="Attach File">
                <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5V6H9v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S5.5 2.79 5.5 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1z"/></svg>
            </label>
            <input type="file" id="file-input">
            
            <!-- Text input box in the middle -->
            <textarea id="prompt-input" placeholder="Message Kiemaen AI..." rows="1" required></textarea>
            
            <span id="file-indicator">📄 <span id="file-name-text"></span></span>

            <!-- Right side: Mic and Execute icons in the same row -->
            <div class="action-group">
                <button type="button" id="mic-btn" class="icon-btn" title="Voice Input">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.39-.9.89 0 2.79-2.25 5.04-5.04 5.04s-5.04-2.25-5.04-5.04c0-.5-.41-.89-.9-.89s-.9.39-.9.89c0 3.18 2.45 5.82 5.5 6.27V21h-2.5c-.55 0-1 .45-1 1s.45 1 1 1h7c.55 0 1-.45 1-1s-.45-1-1-1h-2.5v-2.84c3.05-.45 5.5-3.09 5.5-6.27 0-.5-.41-.89-.9-.89z"/></svg>
                </button>
                <button type="submit" class="execute-btn" title="Execute">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </form>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const chatForm = document.getElementById('chat-form');
        const promptInput = document.getElementById('prompt-input');
        const fileInput = document.getElementById('file-input');
        const fileIndicator = document.getElementById('file-indicator');
        const fileNameText = document.getElementById('file-name-text');
        const micBtn = document.getElementById('mic-btn');
        const detectorBadge = document.getElementById('detector-badge');

        let selectedFile = null;
        let activePersona = 'general';

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileNameText.textContent = selectedFile.name;
                fileIndicator.style.display = 'inline-flex';
            }
        });

        promptInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            if (val.includes('beam') || val.includes('stress') || val.includes('load') || val.includes('concrete') || val.includes('shear')) {
                activePersona = 'engineering';
                detectorBadge.textContent = '⚡ Auto: Civil Engineering';
            } else if (val.includes('price') || val.includes('trade') || val.includes('gold') || val.includes('bitcoin') || val.includes('market')) {
                activePersona = 'trading';
                detectorBadge.textContent = '⚡ Auto: Institutional Trading';
            } else if (val.includes('def ') || val.includes('function') || val.includes('code') || val.includes('python') || val.includes('script')) {
                activePersona = 'coding';
                detectorBadge.textContent = '⚡ Auto: Software Engineering';
            } else {
                activePersona = 'general';
                detectorBadge.textContent = '⚡ Auto: General Core';
            }
        });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            micBtn.addEventListener('click', () => {
                if (micBtn.classList.contains('listening')) {
                    recognition.stop();
                    return;
                }
                recognition.start();
            });

            recognition.onstart = () => micBtn.classList.add('listening');
            recognition.onresult = (event) => {
                promptInput.value += (promptInput.value ? ' ' : '') + event.results[0][0].transcript;
                promptInput.dispatchEvent(new Event('input'));
            };
            recognition.onerror = () => micBtn.classList.remove('listening');
            recognition.onend = () => micBtn.classList.remove('listening');
        } else {
            micBtn.style.display = 'none';
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/```[\s\S]*?```/g, "Code omitted.").replace(/[*#_`-]/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                window.speechSynthesis.speak(utterance);
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const promptText = promptInput.value.trim();
            if (!promptText && !selectedFile) return;

            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user';
            userMsgDiv.textContent = promptText + (selectedFile ? ` [📎 ${selectedFile.name}]` : '');
            chatWindow.appendChild(userMsgDiv);
            
            const currentPrompt = promptText;
            const currentPersona = activePersona;
            const currentFile = selectedFile;

            promptInput.value = '';
            fileInput.value = '';
            selectedFile = null;
            fileIndicator.style.display = 'none';
            detectorBadge.textContent = '⚡ Auto: General Core';
            chatWindow.scrollTop = chatWindow.scrollHeight;

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai';
            aiMsgDiv.innerHTML = `<div class="ai-header"><span>PROCESSING...</span></div>Analyzing telemetry...`;
            chatWindow.appendChild(aiMsgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            const formData = new FormData();
            formData.append('prompt', currentPrompt);
            formData.append('persona', currentPersona);
            if (currentFile) formData.append('file', currentFile);

            try {
                const response = await fetch('/generate', { method: 'POST', body: formData });
                const data = await response.json();
                const responseText = data.response || "No response.";
                
                aiMsgDiv.innerHTML = `
                    <div class="ai-header">
                        <span>KIEMAEN AI (${currentPersona.toUpperCase()})</span>
                        <button class="speak-btn" onclick="speakText(this.dataset.text)" data-text="${encodeURIComponent(responseText)}">🔊 Listen</button>
                    </div>
                    ${marked.parse(responseText)}
                `;
            } catch (err) {
                aiMsgDiv.innerHTML = `<div class="ai-header"><span>ERROR</span></div>Fault: ${err.message}`;
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;
        });
    </script>
</body>
</html>
